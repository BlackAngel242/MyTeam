name: QA U6-U7 Windows (diagnostic jetable)

on:
  push:
    branches: [muse/U6-U7]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Tests update sous Windows et sonde serveur reel
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer la branche
        uses: actions/checkout@v4
      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparer le dossier des journaux
        shell: pwsh
        run: New-Item -ItemType Directory -Force qa-logs | Out-Null
      - name: Tests update et update-helper
        shell: pwsh
        run: |
          node --version 2>&1 | Tee-Object -FilePath qa-logs/versions.log
          node --test test/update-helper.test.mjs test/update.test.mjs 2>&1 | Tee-Object -FilePath qa-logs/tests-update.log
          "code de sortie des tests : $LASTEXITCODE" | Add-Content qa-logs/versions.log
          $global:LASTEXITCODE = 0
      - name: Sonde serveur reel (arbre copie comme la simulation QA)
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'appsrv'
          New-Item -ItemType Directory -Force $app | Out-Null
          Copy-Item server.mjs, package.json -Destination $app
          Copy-Item src, public -Destination $app -Recurse
          $env:BUREAU_PORT = '4899'
          $out = Join-Path $PWD 'qa-logs/serveur-out.log'
          $err = Join-Path $PWD 'qa-logs/serveur-err.log'
          $proc = Start-Process -FilePath node -ArgumentList 'server.mjs' -WorkingDirectory $app -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
          $statuts = @()
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            if ($proc.HasExited) { $statuts += "processus termine apres $($i + 1) s, code $($proc.ExitCode)"; break }
            try { $r = Invoke-WebRequest -Uri 'http://127.0.0.1:4899/' -UseBasicParsing -TimeoutSec 2; $statuts += "t+$($i + 1)s : HTTP $($r.StatusCode)"; break }
            catch { $statuts += "t+$($i + 1)s : $($_.Exception.Message)" }
          }
          $statuts | Tee-Object -FilePath qa-logs/sonde.log
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          $global:LASTEXITCODE = 0
      - name: Televerser les journaux en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-u6u7-journaux
          path: qa-logs/**
          retention-days: 7
          if-no-files-found: warn
