name: Release

on:
  # Publication seulement sur demande explicite : un changement de package.json ne publie plus rien.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # publication npm de confiance (OIDC), sans jeton stocké
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Prepare version and notes
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version ?? '')) throw new Error('Invalid release version');
          const text = readFileSync('CHANGELOG.md', 'utf8');
          const start = text.indexOf(`## [${version}]`);
          if (start === -1) throw new Error('Missing changelog');
          const end = text.indexOf('\n## [', start + 1);
          writeFileSync('release-notes.md', text.slice(start, end === -1 ? undefined : end));
          const title = text.slice(start).split('\n', 1)[0];
          const name = title.match(/·\s*[«"]([^»"]+)[»"]/u)?.[1];
          appendFileSync(process.env.GITHUB_ENV, `VERSION=${version}\nRELEASE_TITLE=MyTeam ${version}${name ? ' « ' + name + ' »' : ''}\n`);
          JS
      - name: Build verified archive and checksum
        run: node scripts/empaqueter-release.mjs "$VERSION" --rev "$GITHUB_SHA"
      - name: Create draft and upload assets
        run: |
          gh release create "v$VERSION" "dist/MyTeam-$VERSION.zip" "dist/MyTeam-$VERSION.zip.sha256" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file release-notes.md --draft
      - name: Verify downloaded draft assets
        run: |
          mkdir verification
          gh release download "v$VERSION" --dir verification --pattern "MyTeam-$VERSION.zip*"
          cd verification
          sha256sum --check "MyTeam-$VERSION.zip.sha256"
          unzip -t "MyTeam-$VERSION.zip"
      # npm avant la release publique : un échec npm laisse un brouillon, jamais une release sans paquet npx.
      - name: Publish npm package (npx @drsmoke/myteam)
        run: |
          if npm view "@drsmoke/myteam@$VERSION" version >/dev/null 2>&1; then
            echo "@drsmoke/myteam@$VERSION est déjà sur npm : rien à publier."
          else
            npm publish --provenance
          fi
      - name: Publish new reference
        run: |
          gh release edit "v$VERSION" --draft=false --latest
          gh release view "v$VERSION" --json isDraft,tagName --jq 'if .isDraft then error("Release is still a draft") else .tagName end'
      # Garde : ne retirer les anciennes releases que si le site ne pointe plus vers elles.
      # Une page sans aucun lien de téléchargement (page de maintenance) ne peut pas casser : on continue.
      - name: Verify Pages download link
        run: |
          for attempt in {1..24}; do
            if page=$(curl --fail --silent --show-error --max-time 20 "https://blackangel242.github.io/MyTeam/?release=$VERSION"); then
              if grep -Fq "releases/download/v$VERSION/MyTeam-$VERSION.zip" <<< "$page"; then exit 0; fi
              if ! grep -Fq "releases/download/" <<< "$page"; then
                echo "La page publiée ne propose aucun téléchargement (maintenance) : aucun lien à casser."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Pages does not reference the new archive; older releases are preserved."
          exit 1
      - name: Retire older releases, preserving Git tags
        run: node scripts/garder-releases.mjs "$GH_REPO" --reference "v$VERSION" --garder 1
