name: "Test PR #12 (Windows, simulé)"

# Banc de test ponctuel de la PR #12 (tête 589876c303364ba4fac5088f7a457458db4120f1).
# Le code du workflow vit sur la branche claude ; le code testé est celui de la PR.
# Tout est simulé : stubs PATH/winget/npm/powershell/irm, fichiers temporaires,
# aucun secret réel, aucun outil payant, aucune installation réelle d'outil IA.
on:
  push:
    branches: [claude]
    paths:
      - .github/workflows/test-pr12-windows.yml

permissions:
  contents: read

jobs:
  test-pr12-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - name: "Checkout du code de la PR #12"
        uses: actions/checkout@v4
        with:
          ref: 589876c303364ba4fac5088f7a457458db4120f1

      - name: Inventaire du runner et préparation des dossiers
        run: |
          $root = "$env:RUNNER_TEMP\pr12"
          New-Item -ItemType Directory -Force -Path $root, "$root\logs", "$root\templates", "$root\stdin", "$root\backup" | Out-Null
          "PR12_HOME=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PR12_TEMPLATES=$root\templates" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PR12_WS=$env:GITHUB_WORKSPACE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Node du runner : $(node --version)"
          Write-Host "npm du runner : $(npm --version)"
          Write-Host "PowerShell : $($PSVersionTable.PSVersion)"
          $wg = Get-Command winget -ErrorAction SilentlyContinue
          Write-Host "winget reel du runner : $(if ($wg) { $wg.Source } else { 'absent' })"
          [IO.File]::WriteAllText("$root\backup\machine-path.txt", [Environment]::GetEnvironmentVariable('Path', 'Machine'))
          [IO.File]::WriteAllText("$root\backup\user-path.txt", [Environment]::GetEnvironmentVariable('Path', 'User'))
          $p = [Environment]::GetEnvironmentVariable('BUREAU_PORT', 'User'); if ($null -eq $p) { $p = '__ABSENT__' }
          [IO.File]::WriteAllText("$root\backup\bureau-port.txt", $p)
          $p = [Environment]::GetEnvironmentVariable('BUREAU_HERDR_PATH', 'User'); if ($null -eq $p) { $p = '__ABSENT__' }
          [IO.File]::WriteAllText("$root\backup\bureau-herdr-path.txt", $p)

      - name: npm run check (code de la PR)
        run: |
          npm run check 2>&1 | Tee-Object -FilePath "$env:PR12_HOME\logs\npm-check.log"
          Write-Host "NPM-CHECK-EXIT: $LASTEXITCODE"

      - name: npm test (code de la PR)
        run: |
          npm test 2>&1 | Tee-Object -FilePath "$env:PR12_HOME\logs\npm-test.log"
          Write-Host "NPM-TEST-EXIT: $LASTEXITCODE"

      - name: Analyse syntaxique de scripts/installer.ps1
        run: |
          $tokens = $null; $erreurs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE\scripts\installer.ps1", [ref]$tokens, [ref]$erreurs)
          if ($erreurs -and $erreurs.Count -gt 0) {
            $erreurs | ForEach-Object { Write-Host "PARSE-ERROR: $($_.Message) ligne $($_.Extent.StartLineNumber)" }
            exit 1
          }
          Write-Host "PARSE-OK: aucune erreur de syntaxe dans scripts/installer.ps1"

      - name: Génération des gabarits de stubs et des entrées standard
        run: |
          $tpl = $env:PR12_TEMPLATES
          function T([string]$name, [string[]]$lines) { Set-Content -LiteralPath (Join-Path $tpl $name) -Value $lines -Encoding Ascii }
          T 'node22.cmd' @('@echo off', 'if /i "%~1"=="--version" echo v22.11.0')
          T 'node20.cmd' @('@echo off', 'if /i "%~1"=="--version" echo v20.19.0')
          T 'clink.cmd' @('@echo off', 'echo clink 2.0 stub')
          T 'claude.cmd' @('@echo off', 'echo claude stub')
          T 'codex.cmd' @('@echo off', 'echo codex stub')
          T 'opencode.cmd' @('@echo off', 'echo opencode stub')
          T 'pi.cmd' @('@echo off', 'echo pi stub')
          T 'gemini.cmd' @('@echo off', 'echo gemini stub')
          T 'agy.cmd' @('@echo off', 'echo agy stub')
          $stdinDir = "$env:PR12_HOME\stdin"
          function S([string]$name, [string[]]$lines) {
            if ($lines.Count -eq 0) { New-Item -ItemType File -Force -Path (Join-Path $stdinDir $name) | Out-Null }
            else { Set-Content -LiteralPath (Join-Path $stdinDir $name) -Value $lines -Encoding Ascii }
          }
          S 's1.txt' @()
          S 's2.txt' @('n', '0', '0')
          S 's3a.txt' @('0', '0')
          S 's3b.txt' @('n', '0', '0')
          S 's3c.txt' @('0', '0')
          S 's4.txt' @('n', '1,3', 'o')
          S 's5.txt' @('n', 'n', '1,3', 'o')
          S 's6.txt' @('n', 'n', '0')
          S 's7.txt' @('n', '6', 'o')
          S 's8.txt' @('n', 'n', '0', '0')
          S 's9.txt' @('n', 'n', 'n', 'n')

      - name: Génération du harnais de scénarios
        run: |
          $harness = @'
          # Harnais de test PR #12 : exécute scripts/installer.ps1 de la PR avec des
          # stubs (PATH, winget, npm, powershell, irm/iex) et une entrée standard préparée.
          # Aucune installation réelle : chaque commande externe aboutit sur un stub
          # qui journalise son appel dans PR12_CMDLOG et simule le résultat.
          param([Parameter(Mandatory = $true)][string]$Scenario)
          $H = $env:PR12_HOME
          $Bin = Join-Path $H ("bin-" + $Scenario)
          $CmdLog = Join-Path $H ("cmdlog-" + $Scenario + ".txt")
          $Tpl = $env:PR12_TEMPLATES
          New-Item -ItemType Directory -Force -Path $Bin | Out-Null
          New-Item -ItemType File -Force -Path $CmdLog | Out-Null
          $env:PR12_CMDLOG = $CmdLog
          $env:PR12_STUBBIN = $Bin
          # Point de départ déterministe : aucun Herdr hérité, aucune variable du bureau.
          Remove-Item -LiteralPath (Join-Path $env:USERPROFILE '.herdr') -Recurse -Force -ErrorAction SilentlyContinue
          [Environment]::SetEnvironmentVariable('BUREAU_PORT', $null, 'User')
          [Environment]::SetEnvironmentVariable('BUREAU_HERDR_PATH', $null, 'User')
          $savedMachine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $savedUser = [Environment]::GetEnvironmentVariable('Path', 'User')
          $sysDirs = @('C:\Windows\System32', 'C:\Windows', 'C:\Windows\System32\Wbem')
          $basePath = (@($Bin) + $sysDirs) -join ';'
          [Environment]::SetEnvironmentVariable('Path', $basePath, 'Machine')
          [Environment]::SetEnvironmentVariable('Path', $Bin, 'User')
          $env:Path = $basePath
          function Write-Stub([string]$Name, [string[]]$Lines) {
            Set-Content -LiteralPath (Join-Path $Bin $Name) -Value $Lines -Encoding Ascii
          }
          function Copy-Template([string]$Template, [string]$Name) {
            Copy-Item -LiteralPath (Join-Path $Tpl $Template) -Destination (Join-Path $Bin $Name) -Force
          }
          function Stub-Winget([string]$Mode) {
            $lines = @('@echo off', 'echo WINGET %* >> "%PR12_CMDLOG%"')
            if ($Mode -eq 'fail') {
              $lines += 'echo Echec simule de winget 1>&2'
              $lines += 'exit /b 1'
            } else {
              $lines += 'echo %* | findstr /c:"OpenJS.NodeJS.LTS" >nul && copy /y "%PR12_TEMPLATES%\node22.cmd" "%PR12_STUBBIN%\node.cmd" >nul'
              $lines += 'echo %* | findstr /c:"chrisant996.Clink" >nul && copy /y "%PR12_TEMPLATES%\clink.cmd" "%PR12_STUBBIN%\clink.cmd" >nul'
              $lines += 'exit /b 0'
            }
            Write-Stub 'winget.cmd' $lines
          }
          function Stub-Npm {
            Write-Stub 'npm.cmd' @('@echo off', 'echo NPM %* >> "%PR12_CMDLOG%"',
              'echo %* | findstr /c:"opencode-ai" >nul && copy /y "%PR12_TEMPLATES%\opencode.cmd" "%PR12_STUBBIN%\opencode.cmd" >nul',
              'echo %* | findstr /c:"pi-coding-agent" >nul && copy /y "%PR12_TEMPLATES%\pi.cmd" "%PR12_STUBBIN%\pi.cmd" >nul',
              'echo %* | findstr /c:"gemini-cli" >nul && copy /y "%PR12_TEMPLATES%\gemini.cmd" "%PR12_STUBBIN%\gemini.cmd" >nul',
              'exit /b 0')
          }
          function Stub-PowerShell {
            Write-Stub 'powershell.cmd' @('@echo off', 'echo POWERSHELL %* >> "%PR12_CMDLOG%"',
              'if not exist "%USERPROFILE%\.herdr\packages" mkdir "%USERPROFILE%\.herdr\packages"',
              'echo %* | findstr /c:"herdr.dev/install.ps1" >nul && copy /y "C:\Windows\System32\where.exe" "%USERPROFILE%\.herdr\packages\herdr.exe" >nul',
              'echo %* | findstr /c:"chatgpt.com/codex" >nul && copy /y "%PR12_TEMPLATES%\codex.cmd" "%PR12_STUBBIN%\codex.cmd" >nul',
              'exit /b 0')
          }
          function Add-PrereqsPresents {
            Copy-Template 'node22.cmd' 'node.cmd'
            Copy-Template 'clink.cmd' 'clink.cmd'
            Copy-Item -LiteralPath 'C:\Windows\System32\where.exe' -Destination (Join-Path $Bin 'herdr.exe') -Force
          }
          function Invoke-RestMethod {
            param([Parameter(Mandatory = $true)][string]$Uri)
            Add-Content -LiteralPath $env:PR12_CMDLOG -Value ("IRM " + $Uri)
            if ($Uri -match 'claude\.ai') { Copy-Template 'claude.cmd' 'claude.cmd' }
            return ''
          }
          function Invoke-Expression {
            foreach ($c in $input) {
              if ("$c" -ne '') { Add-Content -LiteralPath $env:PR12_CMDLOG -Value ("IEX " + $c) }
            }
          }
          switch ($Scenario) {
            'S1'  { Stub-Winget 'ok'; Stub-Npm; Stub-PowerShell }
            'S2'  { Add-PrereqsPresents; Stub-Winget 'ok' }
            'S3a' { Stub-Winget 'fail' }
            'S3b' { Copy-Template 'node20.cmd' 'node.cmd'; Stub-Winget 'ok'; Stub-PowerShell }
            'S3c' { }
            'S4'  { Add-PrereqsPresents; Stub-Winget 'ok'; Stub-Npm; Stub-PowerShell }
            'S5'  { Add-PrereqsPresents; Stub-Winget 'ok'; Stub-Npm; Stub-PowerShell; Copy-Template 'claude.cmd' 'claude.cmd' }
            'S6'  { Add-PrereqsPresents; Stub-Winget 'ok'; Stub-Npm; Stub-PowerShell; Copy-Template 'claude.cmd' 'claude.cmd' }
            'S7'  { Add-PrereqsPresents; Stub-Winget 'ok'; Stub-Npm; Stub-PowerShell }
            'S8'  { Add-PrereqsPresents; Stub-Winget 'ok'; Copy-Template 'agy.cmd' 'agy.cmd' }
            'S9'  { Stub-Winget 'ok'; Stub-Npm; Stub-PowerShell }
            'S10' { Add-PrereqsPresents; Copy-Template 'claude.cmd' 'claude.cmd' }
          }
          $installer = Join-Path $env:GITHUB_WORKSPACE 'scripts\installer.ps1'
          Write-Host "HARNESS: scenario $Scenario, stubs dans $Bin"
          try {
            if ($Scenario -eq 'S1') { & $installer -Lang fr -Port 4317 -SansRaccourci -DryRun }
            elseif ($Scenario -eq 'S9') { & $installer -Lang fr -Port 4317 -SansRaccourci -Oui }
            else { & $installer -Lang fr -Port 4317 -SansRaccourci }
            Write-Host "HARNESS-ENV BUREAU_PORT=$([Environment]::GetEnvironmentVariable('BUREAU_PORT', 'User'))"
            Write-Host "HARNESS-ENV BUREAU_HERDR_PATH=$([Environment]::GetEnvironmentVariable('BUREAU_HERDR_PATH', 'User'))"
          } catch {
            Write-Host "HARNESS: exception pendant le scenario: $($_.Exception.Message)"
          } finally {
            [Environment]::SetEnvironmentVariable('Path', $savedMachine, 'Machine')
            [Environment]::SetEnvironmentVariable('Path', $savedUser, 'User')
            Write-Host 'HARNESS: journal des commandes recues par les stubs :'
            Get-Content -LiteralPath $CmdLog -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("CMDLOG: " + $_) }
          }
          '@
          Set-Content -LiteralPath "$env:PR12_HOME\harness.ps1" -Value $harness -Encoding UTF8

      - name: Génération de la simulation de mise à jour et redémarrage
        run: |
          $sim = @'
          // Simulation de préparation de mise à jour (src/update.mjs de la PR, fetcher
          // factice, archive construite en mémoire) puis de redémarrage (assistant
          // externe src/update-helper.mjs, manifeste temporaire, pid déjà mort :
          // même patron que le test officiel du dépôt). Tout se passe dans un
          // dossier temporaire, aucun réseau réel, aucune vraie release.
          import {mkdtemp, mkdir, writeFile, readFile, readdir, copyFile, rm} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          import {spawn} from 'node:child_process';
          import {createServer} from 'node:net';
          const WS = process.env.PR12_WS;
          const {createUpdater} = await import('file:///' + WS.replace(/\\/g, '/') + '/src/update.mjs');
          let failures = 0;
          const ok = (cond, label) => { console.log('ASSERT ' + (cond ? 'OK' : 'KO') + ' ' + label); if (!cond) failures++; };
          function buildZip(version, serverCode) {
            const entries = [['MyTeam-' + version + '/package.json', Buffer.from(JSON.stringify({version}))], ['MyTeam-' + version + '/server.mjs', Buffer.from(serverCode)]];
            const locals = [], central = []; let offset = 0;
            for (const [name, content] of entries) {
              const n = Buffer.from(name), local = Buffer.alloc(30), directory = Buffer.alloc(46);
              local.writeUInt32LE(0x04034b50, 0); local.writeUInt16LE(20, 4); local.writeUInt32LE(content.length, 18); local.writeUInt32LE(content.length, 22); local.writeUInt16LE(n.length, 26);
              directory.writeUInt32LE(0x02014b50, 0); directory.writeUInt16LE(20, 4); directory.writeUInt16LE(20, 6); directory.writeUInt32LE(content.length, 20); directory.writeUInt32LE(content.length, 24); directory.writeUInt16LE(n.length, 28); directory.writeUInt32LE(offset, 42);
              locals.push(local, n, content); central.push(directory, n); offset += local.length + n.length + content.length;
            }
            const c = Buffer.concat(central), end = Buffer.alloc(22);
            end.writeUInt32LE(0x06054b50, 0); end.writeUInt16LE(entries.length, 8); end.writeUInt16LE(entries.length, 10); end.writeUInt32LE(c.length, 12); end.writeUInt32LE(offset, 16);
            return Buffer.concat([...locals, c, end]);
          }
          const serverCode = [
            "import {createServer} from 'node:http';",
            "import {writeFileSync} from 'node:fs';",
            "writeFileSync('child.pid', String(process.pid));",
            "createServer((q, r) => r.end('nouveau')).listen(Number(process.env.BUREAU_PORT || '0'), '127.0.0.1');"
          ].join('\n');
          const freePort = async () => { const s = createServer(); await new Promise(r => s.listen(0, '127.0.0.1', r)); const p = s.address().port; await new Promise(r => s.close(r)); return p; };
          const port = await freePort();
          const version = '0.5.1';
          const base = 'https://github.com/BlackAngel242/MyTeam/releases/download/v' + version + '/MyTeam-' + version + '.zip';
          const zip = buildZip(version, serverCode);
          const sha = createHash('sha256').update(zip).digest('hex');
          const fetcher = async (url) => {
            if (url.includes('api.github.com')) return new Response(JSON.stringify({tag_name: 'v' + version, draft: false, prerelease: false, assets: [
              {name: 'MyTeam-' + version + '.zip', browser_download_url: base, digest: 'sha256:' + sha},
              {name: 'MyTeam-' + version + '.zip.sha256', browser_download_url: base + '.sha256'}]}));
            if (url.endsWith('.sha256')) return new Response(sha + '  MyTeam-' + version + '.zip\n');
            return new Response(zip);
          };
          const temp = await mkdtemp(join(tmpdir(), 'pr12-update-'));
          const root = join(temp, 'MyTeam');
          const dataRoot = join(temp, 'data');
          await mkdir(join(root, '.bureau'), {recursive: true});
          await mkdir(join(root, '.myteam-local'), {recursive: true});
          await writeFile(join(root, 'package.json'), JSON.stringify({version: '0.5.0'}));
          await writeFile(join(root, 'old.txt'), 'ancienne-version');
          await writeFile(join(root, '.bureau', 'config.json'), 'CONFIG-LOCALE');
          await writeFile(join(root, '.myteam-local', 'journal.txt'), 'JOURNAL-LOCAL');
          const updater = createUpdater({root, dataRoot, fetcher, version: '0.5.0', port: () => port});
          const st = await updater.check();
          ok(st.available === true && st.latest === version, 'check detecte la version ' + version);
          const prep = await updater.prepare();
          ok(prep.ready === version, 'prepare signale ready=' + version);
          const stageName = (await readdir(temp)).find(n => n.startsWith('.myteam-stage-'));
          ok(!!stageName, 'dossier de preparation cree a cote de l installation');
          const stage = join(temp, stageName);
          ok(JSON.parse(await readFile(join(stage, 'package.json'), 'utf8')).version === version, 'le stage contient la nouvelle version');
          ok((await readFile(join(stage, '.bureau', 'config.json'), 'utf8')) === 'CONFIG-LOCALE', 'la configuration .bureau est copiee dans le stage');
          ok((await readFile(join(stage, '.myteam-local', 'journal.txt'), 'utf8')) === 'JOURNAL-LOCAL', 'le journal .myteam-local est copie dans le stage');
          ok(JSON.parse(await readFile(join(root, 'package.json'), 'utf8')).version === '0.5.0', 'installation d origine intacte apres preparation');
          ok((await readFile(join(root, 'old.txt'), 'utf8')) === 'ancienne-version', 'fichiers d origine intacts apres preparation');
          const root2 = join(temp, 'CloneGit');
          await mkdir(join(root2, '.git'), {recursive: true});
          await writeFile(join(root2, 'package.json'), JSON.stringify({version: '0.5.0'}));
          let refused = false;
          try { await createUpdater({root: root2, dataRoot, fetcher, version: '0.5.0', port: () => port}).prepare(); }
          catch (e) { refused = /Copie Git/.test(e.message); }
          ok(refused, 'preparation refusee dans un clone Git');
          ok(JSON.parse(await readFile(join(root2, 'package.json'), 'utf8')).version === '0.5.0', 'clone Git intact apres refus');
          const helper = join(temp, 'update-helper.mjs');
          await copyFile(join(WS, 'src', 'update-helper.mjs'), helper);
          const manifest = helper + '.json';
          await writeFile(manifest, JSON.stringify({root, stage, pid: 999999999, port, version}));
          const child = spawn(process.execPath, [helper, manifest], {cwd: temp, stdio: 'inherit'});
          let up = false, body = '';
          for (let i = 0; i < 60 && !up; i++) {
            try { const r = await fetch('http://127.0.0.1:' + port); body = await r.text(); up = r.ok; } catch {}
            if (!up) await new Promise(r => setTimeout(r, 250));
          }
          ok(up && body === 'nouveau', 'le nouveau serveur repond apres redemarrage simule');
          ok(JSON.parse(await readFile(join(root, 'package.json'), 'utf8')).version === version, 'nouvelle version en place apres echange des dossiers');
          ok((await readFile(join(root, '.bureau', 'config.json'), 'utf8')) === 'CONFIG-LOCALE', 'configuration locale conservee apres redemarrage');
          const backup = (await readdir(temp)).find(n => n.startsWith('.myteam-backup-'));
          ok(!!backup && (await readFile(join(temp, backup, 'old.txt'), 'utf8')) === 'ancienne-version', 'sauvegarde de l ancienne installation presente');
          try { const pid = Number(await readFile(join(root, 'child.pid'), 'utf8')); process.kill(pid); } catch {}
          await new Promise(r => child.on('exit', r));
          await rm(temp, {recursive: true, force: true, maxRetries: 5, retryDelay: 200}).catch(() => {});
          console.log(failures === 0 ? 'UPDATE-SIM: SUCCES' : 'UPDATE-SIM: ' + failures + ' echec(s)');
          process.exit(failures === 0 ? 0 : 1);
          '@
          Set-Content -LiteralPath "$env:PR12_HOME\update-sim.mjs" -Value $sim -Encoding UTF8

      - name: "S1 : -DryRun (simulation, aucune écriture attendue)"
        shell: cmd
        timeout-minutes: 5
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "%PR12_HOME%\harness.ps1" -Scenario S1 < "%PR12_HOME%\stdin\s1.txt" > "%PR12_HOME%\logs\S1.log" 2>&1
          type "%PR12_HOME%\logs\S1.log"

      - name: "S2 : prérequis présents, aucune IA (sélection vide refusée attendue)"
        shell: cmd
        timeout-minutes: 5
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "%PR12_HOME%\harness.ps1" -Scenario S2 < "%PR12_HOME%\stdin\s2.txt" > "%PR12_HOME%\logs\S2.log" 2>&1
          type "%PR12_HOME%\logs\S2.log"

      - name: "S3a : prérequis absents, winget en échec"
        shell: cmd
        timeout-minutes: 5
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "%PR12_HOME%\harness.ps1" -Scenario S3a < "%PR12_HOME%\stdin\s3a.txt" > "%PR12_HOME%\logs\S3a.log" 2>&1
          type "%PR12_HOME%\logs\S3a.log"

      - name: "S3b : Node trop ancien, installations réussies, redétections"
        shell: cmd
        timeout-minutes: 5
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "%PR12_HOME%\harness.ps1" -Scenario S3b < "%PR12_HOME%\stdin\s3b.txt" > "%PR12_HOME%\logs\S3b.log" 2>&1
          type "%PR12_HOME%\logs\S3b.log"

      - name: "S3c : gestionnaire de paquets absent (aucun winget)"
        shell: cmd
        timeout-minutes: 5
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "%PR12_HOME%\harness.ps1" -Scenario S3c < "%PR12_HOME%\stdin\s3c.txt" > "%PR12_HOME%\logs\S3c.log" 2>&1
          type "%PR12_HOME%\logs\S3c.log"

      - name: "S4 : sélection groupée de deux IA (Claude Code et OpenCode)"
        shell: cmd
        timeout-minutes: 5
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "%PR12_HOME%\harness.ps1" -Scenario S4 < "%PR12_HOME%\stdin\s4.txt" > "%PR12_HOME%\logs\S4.log" 2>&1
          type "%PR12_HOME%\logs\S4.log"

      - name: "S5 : Claude Code déjà présent (conservé), sélection Codex et Pi"
        shell: cmd
        timeout-minutes: 5
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "%PR12_HOME%\harness.ps1" -Scenario S5 < "%PR12_HOME%\stdin\s5.txt" > "%PR12_HOME%\logs\S5.log" 2>&1
          type "%PR12_HOME%\logs\S5.log"

      - name: "S6 : sélection vide acceptée (une IA déjà présente)"
        shell: cmd
        timeout-minutes: 5
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "%PR12_HOME%\harness.ps1" -Scenario S6 < "%PR12_HOME%\stdin\s6.txt" > "%PR12_HOME%\logs\S6.log" 2>&1
          type "%PR12_HOME%\logs\S6.log"

      - name: "S7 : Antigravity seul (choix guidé, aucune commande attendue)"
        shell: cmd
        timeout-minutes: 5
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "%PR12_HOME%\harness.ps1" -Scenario S7 < "%PR12_HOME%\stdin\s7.txt" > "%PR12_HOME%\logs\S7.log" 2>&1
          type "%PR12_HOME%\logs\S7.log"

      - name: "S8 : agy présent (détection Antigravity par la section des panneaux)"
        shell: cmd
        timeout-minutes: 5
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "%PR12_HOME%\harness.ps1" -Scenario S8 < "%PR12_HOME%\stdin\s8.txt" > "%PR12_HOME%\logs\S8.log" 2>&1
          type "%PR12_HOME%\logs\S8.log"

      - name: "S9 : mode -Oui (prérequis automatiques, aucun téléchargement IA attendu)"
        shell: cmd
        timeout-minutes: 5
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "%PR12_HOME%\harness.ps1" -Scenario S9 < "%PR12_HOME%\stdin\s9.txt" > "%PR12_HOME%\logs\S9.log" 2>&1
          type "%PR12_HOME%\logs\S9.log"

      - name: "S10 : terminal sans entrée (aucun blocage attendu)"
        shell: cmd
        timeout-minutes: 5
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "%PR12_HOME%\harness.ps1" -Scenario S10 < nul > "%PR12_HOME%\logs\S10.log" 2>&1
          type "%PR12_HOME%\logs\S10.log"

      - name: Simulation de préparation de mise à jour et de redémarrage
        run: |
          node "$env:PR12_HOME\update-sim.mjs" 2>&1 | Tee-Object -FilePath "$env:PR12_HOME\logs\update-sim.log"
          Write-Host "UPDATE-SIM-EXIT: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restauration de l'environnement du runner
        if: always()
        run: |
          $bk = "$env:RUNNER_TEMP\pr12\backup"
          if (Test-Path "$bk\machine-path.txt") { [Environment]::SetEnvironmentVariable('Path', [IO.File]::ReadAllText("$bk\machine-path.txt"), 'Machine') }
          if (Test-Path "$bk\user-path.txt") { [Environment]::SetEnvironmentVariable('Path', [IO.File]::ReadAllText("$bk\user-path.txt"), 'User') }
          if (Test-Path "$bk\bureau-port.txt") { $p = [IO.File]::ReadAllText("$bk\bureau-port.txt"); if ($p -eq '__ABSENT__') { $p = $null }; [Environment]::SetEnvironmentVariable('BUREAU_PORT', $p, 'User') }
          if (Test-Path "$bk\bureau-herdr-path.txt") { $p = [IO.File]::ReadAllText("$bk\bureau-herdr-path.txt"); if ($p -eq '__ABSENT__') { $p = $null }; [Environment]::SetEnvironmentVariable('BUREAU_HERDR_PATH', $p, 'User') }
          Remove-Item -LiteralPath (Join-Path $env:USERPROFILE '.herdr') -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'Environnement du runner restauré.'

      - name: Téléversement des journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr12-windows-logs
          path: ${{ runner.temp }}/pr12/
          if-no-files-found: warn
