<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>MyTeam : Le Bureau des agents (maintenance)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: #0c1423; color: #f2f4f7;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%; max-width: 440px; padding: 32px 28px; text-align: center;
      background: #111e31; border: 2px solid #1d2c44; border-radius: 6px;
    }
    .pixel { width: 96px; height: 96px; margin: 0 auto 20px; image-rendering: pixelated; }
    .kicker { margin: 0 0 8px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #a0dfc4; }
    h1 { margin: 0; font-size: 26px; line-height: 1.25; }
    p { margin: 16px 0 0; font-size: 16px; line-height: 1.6; color: #a7b8ce; }
  </style>
</head>
<body>
  <main>
    <svg class="pixel" viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges">
      <rect x="1" y="1" width="10" height="7" fill="#1d2c44"/>
      <rect x="2" y="2" width="8" height="5" fill="#9dbbff"/>
      <rect x="3" y="3" width="2" height="1" fill="#f2f4f7"/>
      <rect x="6" y="5" width="2" height="1" fill="#a0dfc4"/>
      <rect x="5" y="8" width="2" height="2" fill="#1d2c44"/>
      <rect x="3" y="10" width="6" height="1" fill="#1d2c44"/>
    </svg>
    <p class="kicker">MyTeam</p>
    <h1>Le Bureau des agents est en maintenance</h1>
    <p>La démonstration est temporairement fermée pour maintenance. Merci de revenir à partir du 27 novembre 2026.</p>
  </main>
</body>
</html>
